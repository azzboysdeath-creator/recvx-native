name: Build iOS IPA
on:
  workflow_dispatch: # Allows you to manually trigger the build via GitHub UI

jobs:
  build-ios:
    runs-on: macos-latest # Uses GitHub's cloud-hosted Mac environment
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Compile Native Port
        run: |
          # Executes Patt92's native iOS compilation script
          chmod +x build.sh
          ./build.sh ios

      - name: Package App into IPA Layout
        run: |
          mkdir -p Payload
          # Adjust the name if the script names the .app bundle differently
          cp -r build/ios/*.app Payload/ 2>/dev/null || cp -r *.app Payload/
          zip -r recvx-native.ipa Payload
          rm -rf Payload

      - name: Upload IPA Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recvx-native-unsigned-ipa
          path: recvx-native.ipa
